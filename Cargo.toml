[package]
name = "cattix"
version = "0.1.0"
edition = "2021"
description = "Fleet management for NixOS hosts"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/cattix-core",
    "crates/cattix-utils",
    "crates/cattix-nix",
    "crates/cattix-transport",
    "crates/cattix-cli",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
console = "0.16.6"
indicatif = "0.18.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dependencies]
cattix-cli = { path = "crates/cattix-cli" }
cattix-core = { path = "crates/cattix-core" }
anyhow = { workspace = true }
serde_json = "1"
